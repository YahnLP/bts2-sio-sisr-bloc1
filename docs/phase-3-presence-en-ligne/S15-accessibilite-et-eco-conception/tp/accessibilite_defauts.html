<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Contact</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .discret { color: #999999; }
    .bouton { background: #1f4e79; color: #ffffff; padding: 0.5rem 1rem; display: inline-block; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Mairie de Bellevigne</h1>
  <h4>Contacter l'accueil</h4>
  <img src="facade.jpg">
  <p class="discret">Réponse sous deux jours ouvrés.</p>
  <form>
    <input type="text" name="nom" placeholder="Votre nom">
    <input type="text" name="courriel" placeholder="Votre courriel">
    <div class="bouton" onclick="envoyer()">Envoyer</div>
  </form>
  <p>Pour les horaires, <a href="horaires.html">cliquez ici</a>.</p>
</body>
</html>
